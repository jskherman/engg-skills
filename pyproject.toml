[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engg-skills"
version = "0.2.0"
description = "Agent skills for chemical engineering, process engineering, applied sciences, and engineering statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jesh", email = "jskherman@users.noreply.github.com" }
]
keywords = ["agent-skills", "chemical-engineering", "process-engineering", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering"
]
dependencies = [
    "chemicals>=1.5",
    "fluids>=1.3",
    "ht>=1.2",
    "thermo>=0.6",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
stats = [
    "statsmodels>=0.14",
    "pandas>=2.1",
]
bayes = [
    "pymc>=5.10",
    "arviz>=0.16",
    "pandas>=2.1",
]
causal = [
    "networkx>=3.2",
]
all = [
    "statsmodels>=0.14",
    "pandas>=2.1",
    "pymc>=5.10",
    "arviz>=0.16",
    "networkx>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["skills/engg_skills_common"]
include = ["engg_skills_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
